<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Lreporter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #050810; --bg-secondary: #0a0f1c; --glass-bg: rgba(18, 26, 43, 0.6);
    --glass-border: rgba(255, 255, 255, 0.08); --glass-hover: rgba(30, 144, 255, 0.15);
    --text-main: #f0f4f8; --text-muted: #8b9bb4;
    --accent-blue: #3b82f6; --accent-purple: #8b5cf6; --accent-cyan: #06b6d4;
    --accent-red: #ef4444; --accent-gold: #f59e0b; --accent-green: #10b981;
    --gradient-main: linear-gradient(135deg, #3b82f6, #8b5cf6);
    --gradient-hot: linear-gradient(135deg, #ef4444, #f97316);
    --shadow-glow: 0 0 30px rgba(59, 130, 246, 0.2);
    --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.4);
    --base-font-size: 16px; --radius-lg: 24px; --radius-md: 16px;
  }
  [data-theme="light"] {
    --bg: #f0f4f8; --bg-secondary: #ffffff; --glass-bg: rgba(255, 255, 255, 0.7);
    --glass-border: rgba(0, 0, 0, 0.1); --text-main: #0f172a; --text-muted: #64748b;
    --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; font-size: var(--base-font-size); }
  body { font-family: 'Vazirmatn', Tahoma, sans-serif; background-color: var(--bg); color: var(--text-main); line-height: 1.8; min-height: 100vh; overflow-x: hidden; }

  .bg-mesh { position: fixed; inset: 0; z-index: -2; background: radial-gradient(circle at 15% 15%, rgba(59,130,246,0.15), transparent 40%), radial-gradient(circle at 85% 85%, rgba(139,92,246,0.15), transparent 40%); filter: blur(40px); animation: meshMove 20s ease-in-out infinite alternate; }
  @keyframes meshMove { 0% { transform: scale(1) translate(0,0); } 100% { transform: scale(1.1) translate(2%,2%); } }
  .bg-grid { position: fixed; inset: 0; z-index: -1; background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 50px 50px; mask-image: radial-gradient(circle at center, black, transparent 80%); -webkit-mask-image: radial-gradient(circle at center, black, transparent 80%); }
  
  header { position: sticky; top: 0; z-index: 100; background: rgba(5,8,16,0.7); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); }
  [data-theme="light"] header { background: rgba(240,244,248,0.7); }
  .header-inner { max-width: 1400px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 1.6rem; }
  .logo span { background: var(--gradient-main); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -1px; }
  .logo-img { width: 40px; height: 40px; border-radius: 12px; box-shadow: var(--shadow-glow); background: var(--gradient-main); display: grid; place-items: center; color: white; font-size: 1.2rem; }
  .search-box { flex: 1; min-width: 250px; position: relative; }
  .search-box input { width: 100%; padding: 14px 48px 14px 20px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-md); color: var(--text-main); font-family: inherit; font-size: 0.95rem; outline: none; transition: 0.3s; }
  .search-box input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 4px rgba(59,130,246,0.15); }
  .search-box::before { content: '🔍'; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 18px; opacity: 0.6; pointer-events: none; }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .icon-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-main); width: 44px; height: 44px; border-radius: var(--radius-md); cursor: pointer; font-size: 18px; display: grid; place-items: center; transition: 0.3s; position: relative; }
  .icon-btn:hover { background: var(--glass-hover); border-color: var(--accent-blue); transform: translateY(-2px); }
  .icon-btn .badge { position: absolute; top: -6px; right: -6px; background: var(--gradient-hot); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 12px; box-shadow: 0 0 10px rgba(239,68,68,0.5); }

  .statusbar { max-width: 1400px; margin: 0 auto; padding: 0 24px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-muted); flex-wrap: wrap; gap: 10px; }
  .live-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; background: rgba(16,185,129,0.1); color: var(--accent-green); border-radius: 20px; font-weight: 700; border: 1px solid rgba(16,185,129,0.2); }
  .live-badge .dot { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; animation: pulse 1.5s infinite; }
  .live-badge.loading { background: rgba(245,158,11,0.1); color: var(--accent-gold); border-color: rgba(245,158,11,0.2); }
  .live-badge.loading .dot { background: var(--accent-gold); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  .infobar { max-width: 1400px; margin: 0 auto; padding: 16px 24px 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .info-card { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: var(--radius-md); padding: 14px 20px; display: flex; align-items: center; gap: 14px; transition: 0.3s; }
  .info-card:hover { border-color: var(--accent-blue); }
  .info-card .ico { font-size: 24px; }
  .info-card .body { display: flex; flex-direction: column; }
  .info-card .label { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; }
  .info-card .value { font-size: 0.95rem; font-weight: 800; }
  .info-card .sub { font-size: 0.75rem; color: var(--text-muted); }

  .nav-wrap { max-width: 1400px; margin: 0 auto; padding: 16px 24px 8px; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
  .nav-wrap::-webkit-scrollbar { display: none; }
  .nav-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-muted); padding: 10px 20px; border-radius: 30px; cursor: pointer; font-family: inherit; font-size: 0.9rem; font-weight: 700; transition: 0.3s; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
  .nav-btn:hover { background: var(--glass-hover); color: var(--text-main); border-color: var(--accent-blue); }
  .nav-btn.active { background: var(--gradient-main); color: #fff; border-color: transparent; box-shadow: 0 4px 20px rgba(59,130,246,0.4); }
  .nav-btn .cnt { font-size: 11px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 10px; }
  .filters-wrap { max-width: 1400px; margin: 0 auto; padding: 0 24px 16px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .filters-wrap::-webkit-scrollbar { display: none; }
  .filter-btn { background: transparent; border: 1px solid var(--glass-border); color: var(--text-muted); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-family: inherit; font-size: 0.8rem; font-weight: 600; transition: 0.3s; white-space: nowrap; }
  .filter-btn:hover { border-color: var(--accent-blue); color: var(--text-main); }
  .filter-btn.active { background: rgba(59,130,246,0.2); border-color: var(--accent-blue); color: var(--accent-blue); }

  .grid { max-width: 1400px; margin: 0 auto; padding: 0 24px 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
  .card { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; cursor: pointer; }
  .card:hover { transform: translateY(-8px) scale(1.01); border-color: rgba(59,130,246,0.4); box-shadow: var(--shadow-card), var(--shadow-glow); }
  
  /* 🌟 خط طلایی برای اخبار ویژه */
  .card.featured { border-right: 5px solid var(--accent-gold); box-shadow: inset -10px 0 20px -10px rgba(245, 158, 11, 0.3); }
  
  .card.read { opacity: 0.6; filter: grayscale(0.5); }
  .card.saved { border-color: var(--accent-gold); box-shadow: 0 0 20px rgba(245,158,11,0.2); }
  .card.manual { border-right: 4px solid var(--accent-gold); }
  
  .card-img-wrap { position: relative; height: 200px; background: #0f1525; overflow: hidden; }
  .card-img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; }
  .card:hover .card-img { transform: scale(1.08); }
  .card-img-wrap::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 0%, transparent 50%); }
  
  .star-btn { position: absolute; top: 16px; right: 16px; z-index: 10; width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2); color: #fff; display: grid; place-items: center; font-size: 20px; transition: 0.3s; cursor: pointer; }
  .star-btn:hover { background: var(--accent-gold); color: #000; transform: scale(1.1) rotate(15deg); }
  .star-btn.saved { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); }
  
  .card-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; flex: 1; z-index: 2; }
  .card-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .source-tag { font-size: 11px; font-weight: 800; color: #fff; background: var(--gradient-main); padding: 5px 14px; border-radius: 20px; }
  .source-tag.manual { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #000; }
  
  /* 🌟 برچسب طلایی خبر ویژه */
  .source-tag.featured { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #000; }
  
  .views-tag { font-size: 11px; font-weight: 700; color: var(--text-main); background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 20px; border: 1px solid var(--glass-border); }
  .views-tag.hot { background: var(--gradient-hot); color: #fff; animation: pulse-hot 2s infinite; }
  @keyframes pulse-hot { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  
  .card h2 { font-size: 1.15rem; font-weight: 800; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.8; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card-footer { display: flex; justify-content: space-between; border-top: 1px solid var(--glass-border); padding-top: 14px; font-size: 0.8rem; color: var(--text-muted); }

  .skeleton { height: 380px; border-radius: var(--radius-lg); background: linear-gradient(90deg, var(--glass-bg) 25%, rgba(255,255,255,0.06) 50%, var(--glass-bg) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border: 1px solid var(--glass-border); }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes slideOut { to { transform: translateX(120%); opacity: 0; } }

  .modal-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(5,8,16,0.85); backdrop-filter: blur(12px); display: none; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
  .modal-overlay.open { display: flex; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal { background: var(--bg-secondary); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); max-width: 800px; width: 100%; margin: auto; position: relative; box-shadow: var(--shadow-card); animation: slideUp 0.4s; overflow: hidden; }
  @keyframes slideUp { from { transform: translateY(40px) scale(0.95); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
  .modal-hero { width: 100%; max-height: 400px; object-fit: cover; }
  .modal-content { padding: 32px; }
  .modal-close, .modal-star { position: absolute; top: 16px; width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2); color: #fff; display: grid; place-items: center; cursor: pointer; transition: 0.3s; z-index: 10; }
  .modal-close { left: 16px; font-size: 24px; }
  .modal-star { right: 16px; font-size: 22px; }
  .modal-close:hover { background: var(--accent-red); transform: rotate(90deg); }
  .modal-star:hover { background: var(--accent-gold); color: #000; }
  .modal-star.saved { background: var(--accent-gold); color: #000; }
  .modal h1 { font-size: 1.6rem; font-weight: 900; margin-bottom: 20px; line-height: 1.5; }
  .modal-body { font-size: 1rem; line-height: 2.2; }
  .modal-body img { max-width: 100%; border-radius: var(--radius-md); margin: 20px 0; }
  .modal-body a { color: var(--accent-cyan); text-decoration: none; border-bottom: 1px dashed; }

  .btn { padding: 12px 24px; border-radius: var(--radius-md); font-weight: 700; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text-main); transition: 0.3s; font-family: inherit; }
  .btn:hover { background: var(--glass-hover); border-color: var(--accent-blue); transform: translateY(-2px); }
  .btn-primary { background: var(--gradient-main); border: none; color: #fff; box-shadow: 0 4px 15px rgba(59,130,246,0.3); }

  .auth-input { width: 100%; padding: 12px 16px; margin-bottom: 12px; background: var(--bg); border: 1px solid var(--glass-border); border-radius: 10px; color: var(--text-main); font-family: inherit; font-size: 1rem; outline: none; transition: 0.3s; }
  .auth-input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }

  @media (max-width: 768px) {
    .header-inner { padding: 12px 16px; }
    .search-box { order: 3; width: 100%; min-width: 100%; margin-top: 8px; }
    .infobar { grid-template-columns: 1fr 1fr; padding: 12px 16px 0; gap: 8px; }
    .info-card { padding: 10px 14px; }
    .info-card .label { font-size: 0.65rem; }
    .info-card .value { font-size: 0.85rem; }
    .nav-wrap, .filters-wrap { padding-left: 16px; padding-right: 16px; }
    .grid { padding: 0 16px 30px; grid-template-columns: 1fr; gap: 16px; }
    .modal-overlay { padding: 0; }
    .modal { border-radius: 0; min-height: 100vh; max-width: 100%; overflow-y: auto; }
    .modal-content { padding: 24px 20px; }
  }
  @media (max-width: 400px) { .infobar { grid-template-columns: 1fr; } }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }
</style>
</head>
<body>

<div class="bg-mesh"></div><div class="bg-grid"></div>

<header>
  <div class="header-inner">
    <div class="logo"><div class="logo-img">L</div><span>Lreporter</span></div>
    <div class="search-box"><input type="text" id="searchInput" placeholder="جستجو در اخبار..."></div>
    <div class="header-actions">
      <button class="icon-btn" id="notifBtn" title="پیام‌ها">🔔<span class="badge" id="notifBadge" style="display:none">0</span></button>
      <button class="icon-btn" id="userBtn" title="حساب کاربری">👤</button>
      <button class="icon-btn" id="themeBtn" title="تغییر تم">🌙</button>
      <button class="icon-btn" id="statsBtn" title="آمار">📊</button>
      <button class="icon-btn" id="settingsBtn" title="تنظیمات">⚙️</button>
      <button class="icon-btn" id="savedBtn" title="ذخیره‌شده">⭐<span class="badge" id="savedBadge" style="display:none">0</span></button>
      <button class="icon-btn" id="refreshBtn" title="به‌روزرسانی">🔄</button>
    </div>
  </div>
  <div class="statusbar">
    <span style="display:flex;gap:10px;align-items:center;">
      <span class="live-badge" id="liveBadge"><span class="dot"></span> زنده</span>
      <span id="unreadCount" style="font-weight:800;color:var(--accent-cyan);">۰</span>
    </span>
    <span id="status" style="font-weight:600;">در حال بارگذاری...</span>
  </div>
</header>

<div class="infobar">
  <div class="info-card"><span class="ico">📅</span><div class="body"><span class="label">تاریخ</span><span class="value" id="persianDate">...</span><span class="sub" id="clockTime"></span></div></div>
  <div class="info-card"><span class="ico">🌡️</span><div class="body"><span class="label">آب و هوای تهران</span><span class="value" id="weatherTemp">—</span><span class="sub" id="weatherDesc">—</span></div></div>
  <div class="info-card"><span class="ico">💵</span><div class="body"><span class="label">قیمت دلار (بازار آزاد)</span><span class="value" id="dollarPrice">—</span><span class="sub" id="dollarChange">—</span></div></div>
  <div class="info-card"><span class="ico">🪙</span><div class="body"><span class="label">طلای ۱۸ عیار (هر گرم)</span><span class="value" id="goldPrice">—</span><span class="sub" id="goldChange">—</span></div></div>
</div>

<div class="nav-wrap">
  <button class="nav-btn active" data-mode="all">📰 همه <span class="cnt" id="cntAll">0</span></button>
  <button class="nav-btn" data-mode="unread">📬 نخوانده <span class="cnt" id="cntUnread">0</span></button>
  <button class="nav-btn" data-mode="saved">⭐ ذخیره <span class="cnt" id="cntSaved">0</span></button>
  <button class="nav-btn" data-mode="trending">🔥 ترند <span class="cnt" id="cntTrending">0</span></button>
</div>

<div class="filters-wrap" id="filtersWrap"></div>
<div class="grid" id="content"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>

<footer style="text-align:center;padding:40px 20px;color:var(--text-muted);font-size:0.85rem;border-top:1px solid var(--glass-border);margin-top:40px;">
  <div style="font-weight:900;font-size:1.2rem;margin-bottom:8px;background:var(--gradient-main);-webkit-background-clip:text;color:transparent;">Lreporter v18</div>
  ساخته‌شده با ❤️ و تکنولوژی‌های مدرن
</footer>

<!-- مودال تنظیمات -->
<div class="modal-overlay" id="settingsModal" style="z-index:2000;">
  <div class="modal" style="max-width:400px;">
    <button class="modal-close" id="settingsClose">✕</button>
    <div class="modal-content">
      <h2 style="font-size:1.2rem;margin-bottom:20px;color:var(--accent-cyan);">⚙️ تنظیمات</h2>
      <div style="margin-bottom:20px;">
        <label style="display:block;margin-bottom:8px;font-weight:700;color:var(--text-muted);">اندازه فونت</label>
        <div style="display:flex;gap:10px;align-items:center;">
          <button class="btn" id="fontMinus">−</button>
          <span id="fontVal" style="flex:1;text-align:center;font-weight:800;font-size:1.1rem;">۱۶</span>
          <button class="btn" id="fontPlus">+</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- مودال آمار -->
<div class="modal-overlay" id="statsModal" style="z-index:2000;">
  <div class="modal" style="max-width:450px;">
    <button class="modal-close" id="statsClose">✕</button>
    <div class="modal-content">
      <h2 style="font-size:1.2rem;margin-bottom:20px;color:var(--accent-cyan);">📊 آمار شما</h2>
      <div id="statsContent"></div>
    </div>
  </div>
</div>

<!-- مودال ثبت‌نام و ورود کاربران -->
<div class="modal-overlay" id="authModal" style="z-index:5000;">
  <div class="modal" style="max-width:400px;">
    <button class="modal-close" id="authClose">✕</button>
    <div class="modal-content">
      <h2 style="font-size:1.5rem;margin-bottom:20px;color:var(--accent-cyan);text-align:center;">👤 حساب کاربری</h2>
      <div style="display:flex; gap:10px; margin-bottom:20px;">
        <button class="btn active" id="tabLogin" style="flex:1; justify-content:center;">ورود</button>
        <button class="btn" id="tabRegister" style="flex:1; justify-content:center;">ثبت‌نام</button>
      </div>
      
      <form id="loginForm">
        <input type="text" id="loginUser" class="auth-input" placeholder="نام کاربری..." required>
        <input type="password" id="loginPass" class="auth-input" placeholder="رمز عبور..." required>
        <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%; justify-content:center;">ورود به حساب</button>
      </form>
      
      <form id="registerForm" style="display:none;">
        <input type="text" id="regUser" class="auth-input" placeholder="نام کاربری جدید..." required>
        <input type="password" id="regPass" class="auth-input" placeholder="رمز عبور جدید..." required>
        <button type="submit" class="btn btn-primary" id="regBtn" style="width:100%; justify-content:center;">ساخت حساب جدید</button>
      </form>
    </div>
  </div>
</div>

<!-- مودال پیام‌ها -->
<div class="modal-overlay" id="notifModal" style="z-index:5000;">
  <div class="modal" style="max-width:450px;">
    <button class="modal-close" onclick="document.getElementById('notifModal').classList.remove('open')">✕</button>
    <div class="modal-content">

function safeParse(str, fallback) { try { return JSON.parse(str); } catch { return fallback; } }

function formatTime(dateStr) {
  if (!dateStr) return ''; const d = new Date(dateStr); if (isNaN(d.getTime())) return '';
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'همین الان'; if (diff < 3600) return Math.floor(diff / 60) + ' دقیقه پیش';

}
function showToast(message, duration = 4000) {

}

function detectCategory(text) {
  if (!text) return 'عمومی';
  const t = text.toLowerCase();
  for (const [cat, words] of Object.entries(CATEGORIES)) {
    if (words.some(w => t.includes(w.toLowerCase()))) return cat;
  }
  return 'عمومی';
}

function cleanContent(html) {
  if (!html) return '<p>محتوایی موجود نیست.</p>';
  const raw = String(html);
  if (!/<[a-z][\s\S]*>/i.test(raw)) {
    return raw.split(/\n+/).filter(p => p.trim()).map(p => `<p>${escapeHtml(p.trim())}</p>`).join('');
  }
  const doc = new DOMParser().parseFromString(raw, 'text/html');
  doc.querySelectorAll('script,style,iframe,object,embed,form,link,meta,base').forEach(el => el.remove());
  doc.querySelectorAll('*').forEach(el => {
    [...el.attributes].forEach(a => {
      const name = a.name.toLowerCase();
      const val = (a.value || '').trim();
      if (name.startsWith('on')) el.removeAttribute(a.name);
      if ((name === 'href' || name === 'src' || name === 'xlink:href') && /^(javascript|data:text\/html|vbscript):/i.test(val)) {
        el.removeAttribute(a.name);
      }
    });

    if (el.tagName === 'IMG') { el.setAttribute('loading', 'lazy'); el.setAttribute('referrerpolicy', 'no-referrer'); }

}

async function fetchAllViews() {

}
async function incrementView(link) {
  if (!link) return 0; newsViews[link] = (newsViews[link] || 0) + 1; updateViewsUI(link);
  try { const res = await fetchWithTimeout(VIEWS_API, 8000, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ link }) }); if (res.ok) { const data = await res.json(); if (data && typeof data.count === 'number') { newsViews[link] = data.count; updateViewsUI(link); return data.count; } } } catch {}
  return newsViews[link] || 0;
}
function getViewCount(link) { return newsViews[link] || 0; }
function isHotNews(link) { return getViewCount(link) >= TRENDING_VIEW_THRESHOLD; }
function formatViews(n) { n = Number(n) || 0; if (n < 1) return '۰'; if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M'; if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'K'; return n.toLocaleString('fa-IR'); }
function viewsBadgeHtml(link) { const v = getViewCount(link); if (v < 1) return ''; const hot = v >= TRENDING_VIEW_THRESHOLD; return `<span class="views-tag${hot ? ' hot' : ''}">👁 ${formatViews(v)}${hot ? ' 🔥' : ''}</span>`; }

}

    if (!res.ok) throw new Error('HTTP error');

    if (gold) { document.getElementById('goldPrice').textContent = gold.price.toLocaleString('fa-IR') + ' تومان'; const changeSign = gold.change_pct > 0 ? '▲' : (gold.change_pct < 0 ? '▼' : ''); document.getElementById('goldChange').textContent = `${changeSign} ${Math.abs(gold.change_pct || 0).toFixed(1)}% تغییر`; }
  } catch (e) { document.getElementById('dollarPrice').textContent = '—'; document.getElementById('dollarChange').textContent = '—'; document.getElementById('goldPrice').textContent = '—'; document.getElementById('goldChange').textContent = '—'; }
}

function getPersianVoice() { if (!window.speechSynthesis) return null; const voices = window.speechSynthesis.getVoices(); return voices.find(v => v.lang === 'fa-IR') || voices.find(v => v.lang.startsWith('fa')) || voices.find(v => v.lang.startsWith('ar')) || voices[0]; }
function cleanTextForTTS(text) { return text ? text.replace(/[\u200B-\u200D\uFEFF]/g, '').replace(/[«»""'']/g, '').replace(/\[.*?\]/g, '').replace(/\(.*?\)/g, '').replace(/https?:\/\/\S+/g, '').replace(/\s+/g, ' ').trim() : ''; }
function splitTextIntoChunks(text, maxLength = 200) { const sentences = text.split(/[.!؟?\n]+/).filter(s => s.trim().length > 0); const chunks = []; let currentChunk = ''; for (const sentence of sentences) { const trimmed = sentence.trim(); if (!trimmed) continue; if ((currentChunk + ' ' + trimmed).length <= maxLength) { currentChunk = currentChunk ? currentChunk + '. ' + trimmed : trimmed; } else { if (currentChunk) chunks.push(currentChunk + '.'); if (trimmed.length > maxLength) { const words = trimmed.split(' '); let subChunk = ''; for (const word of words) { if ((subChunk + ' ' + word).length <= maxLength) { subChunk = subChunk ? subChunk + ' ' + word : word; } else { if (subChunk) chunks.push(subChunk); subChunk = word; } } if (subChunk) currentChunk = subChunk; } else currentChunk = trimmed; } } if (currentChunk) chunks.push(currentChunk + '.'); return chunks; }
function setupTTS() {
  const playBtn = document.getElementById('ttsPlayBtn'); const pauseBtn = document.getElementById('ttsPauseBtn'); const stopBtn = document.getElementById('ttsStopBtn');
  playBtn.onclick = () => {
    if (!currentNews) return;
    if (ttsSpeaking) { if (ttsPaused) { window.speechSynthesis.resume(); ttsPaused = false; playBtn.textContent = '🔊 در حال خواندن...'; } else { window.speechSynthesis.pause(); ttsPaused = true; playBtn.textContent = '▶ ادامه'; } return; }
    let textToRead = currentNews.plain || ''; if (!textToRead && currentNews.content) { const temp = document.createElement('div'); temp.innerHTML = currentNews.content; textToRead = temp.textContent || temp.innerText || ''; } if (!textToRead) textToRead = currentNews.title || '';
    const cleanText = cleanTextForTTS(textToRead); if (cleanText.length < 5) { showToast('متنی برای خواندن وجود ندارد'); return; }
    ttsQueue = splitTextIntoChunks(cleanText.slice(0, 5000), 200); ttsCurrentIndex = 0; ttsSpeaking = true; ttsPaused = false;
    playBtn.textContent = '🔊 در حال خواندن...'; pauseBtn.style.display = 'inline-flex'; stopBtn.style.display = 'inline-flex'; speakNextChunk();
  };
  pauseBtn.onclick = () => { if (ttsPaused) { window.speechSynthesis.resume(); ttsPaused = false; pauseBtn.textContent = '⏸ توقف'; playBtn.textContent = '🔊 در حال خواندن...'; } else { window.speechSynthesis.pause(); ttsPaused = true; pauseBtn.textContent = '▶ ادامه'; playBtn.textContent = '⏸ متوقف'; } };
  stopBtn.onclick = () => { window.speechSynthesis.cancel(); ttsSpeaking = false; ttsPaused = false; ttsQueue = []; ttsCurrentIndex = 0; playBtn.textContent = '🔊 خواندن'; pauseBtn.style.display = 'none'; stopBtn.style.display = 'none'; };
  function speakNextChunk() { if (ttsCurrentIndex >= ttsQueue.length) { ttsSpeaking = false; ttsPaused = false; playBtn.textContent = '🔊 خواندن'; pauseBtn.style.display = 'none'; stopBtn.style.display = 'none'; showToast('✅ خواندن تمام شد'); return; } const chunk = ttsQueue[ttsCurrentIndex]; if (!chunk || !chunk.trim()) { ttsCurrentIndex++; speakNextChunk(); return; } const u = new SpeechSynthesisUtterance(chunk); u.lang = 'fa-IR'; u.rate = 0.9; const voice = getPersianVoice(); if (voice) u.voice = voice; u.onend = () => { if (!ttsSpeaking) return; ttsCurrentIndex++; if (!ttsPaused) setTimeout(speakNextChunk, 100); }; u.onerror = () => { if (!ttsSpeaking) return; ttsCurrentIndex++; if (!ttsPaused) setTimeout(speakNextChunk, 100); }; window.speechSynthesis.speak(u); }
}

// ==========================================
// دریافت و نمایش اخبار
// ==========================================
function getTrendingNews(limit = 30, sourceList = null) { const base = sourceList || allNews; return [...base].map(n => ({ ...n, views: getViewCount(n.link) })).filter(n => n.views >= TRENDING_VIEW_THRESHOLD).sort((a, b) => b.views - a.views).slice(0, limit); }

async function loadAll() {
  if (isLoading) return; isLoading = true;
  const badge = document.getElementById('liveBadge'); 
  if(badge) { badge.classList.add('loading'); badge.innerHTML = '<span class="dot"></span> دریافت...'; }
  
  try {
    const [resNews, resManual] = await Promise.allSettled([fetchWithTimeout(SUPABASE_URL, 10000), fetchWithTimeout(MANUAL_NEWS_API, 10000)]);
    const knownLinks = new Set(allNews.map(n => n.link));
    
    if (resNews.status === 'fulfilled' && resNews.value.ok) {
      const news = await resNews.value.json();
      if (Array.isArray(news)) {
        for (const item of news) {
          if (item.link && item.title && !knownLinks.has(item.link)) {
            if (!item.category) item.category = detectCategory(item.title + ' ' + (item.plain || ''));
            item.is_featured = false; // سایت‌های دیگر ویژه نیستند
            allNews.push(item); knownLinks.add(item.link);
          }
        }
      }
    }
    
    if (resManual.status === 'fulfilled' && resManual.value.ok) {
      const mnews = await resManual.value.json();
      if (Array.isArray(mnews)) {
        for (const item of mnews) {
          if (!item.link) item.link = 'manual:' + (item._id || item.id || Date.now());
          if (item.title && !knownLinks.has(item.link)) {
            if (!item.category) item.category = detectCategory(item.title + ' ' + (item.plain || ''));
            item._manual = true;
            // تبدیل دقیق مقدار ویژه
            item.is_featured = (item.is_featured === true || item.is_featured === 'true');
            allNews.push(item); knownLinks.add(item.link);
          }
        }
      }
    }
    
    if (allNews.length === 0) {
      document.getElementById('status').textContent = 'دریافت از منابع پشتیبان...';
      const fallback = await fetchFallbackNews();
      for (const item of fallback) {
        if (item.link && item.title && !knownLinks.has(item.link)) {
          item.is_featured = false;
          allNews.push(item); knownLinks.add(item.link);
        }
      }
    }
    
    // 🌟 مرتب‌سازی نهایی: اول ویژه‌ها، سپس بر اساس تاریخ
    allNews.sort((a, b) => {
      if (a.is_featured && !b.is_featured) return -1;
      if (!a.is_featured && b.is_featured) return 1;
      return (new Date(b.date || b.pubDate || 0).getTime() || 0) - (new Date(a.date || a.pubDate || 0).getTime() || 0);
    });

    await fetchAllViews(); buildFilters(); render();
    
    document.getElementById('status').textContent = `آخرین بروزرسانی: ${new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' })}`;
    startProgressiveDisplay();
  } catch (err) { document.getElementById('status').textContent = '⚠️ خطا در دریافت'; } 
  finally { 
      isLoading = false; 
      if(badge) { badge.classList.remove('loading'); badge.innerHTML = '<span class="dot"></span> زنده'; }
  }
}

async function fetchFallbackNews() {
  try {
    const feeds = [{ name: 'ایرنا', url: 'https://www.irna.ir/rss' }, { name: 'مهر', url: 'https://www.mehrnews.com/rss' }, { name: 'ایسنا', url: 'https://www.isna.ir/rss' }];
    const results = await Promise.allSettled(feeds.map(f => fetchWithTimeout(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(f.url)}`, 10000).then(r => r.json())));
    const fallbackNews = []; results.forEach((res, index) => { if (res.status === 'fulfilled' && res.value && res.value.items) { res.value.items.forEach(item => { let plain = item.description ? item.description.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim() : ''; fallbackNews.push({ title: item.title, link: item.link, summary: plain.slice(0, 250), content: item.content || item.description || '', plain: plain, image: item.thumbnail || '', date: item.pubDate || new Date().toISOString(), source: feeds[index].name, category: detectCategory(item.title + ' ' + plain), textLength: plain.length }); }); } }); return fallbackNews;
  } catch (e) { return []; }
}

function startProgressiveDisplay() {
  if (displayTimer) return;
  displayTimer = setInterval(() => {
    if (displayLimit >= getFilteredList().length) { clearInterval(displayTimer); displayTimer = null; return; }
    displayLimit += DISPLAY_STEP; render();
  }, DISPLAY_INTERVAL);
}

function buildFilters() {
  let baseList = allNews;
  if (activeMode === 'unread') baseList = baseList.filter(n => !readLinks.has(n.link));
  else if (activeMode === 'saved') baseList = baseList.filter(n => savedLinks.has(n.link));
  else if (activeMode === 'trending') baseList = getTrendingNews(30, baseList);
  if (searchQuery.trim()) { const q = searchQuery.trim().toLowerCase(); baseList = baseList.filter(n => (n.title || '').toLowerCase().includes(q) || (n.plain || '').toLowerCase().includes(q)); }
  const counts = {}; baseList.forEach(n => { const cat = n.category || 'عمومی'; counts[cat] = (counts[cat] || 0) + 1; });
  const totalCount = baseList.length; const cats = ['همه', ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];
  const box = document.getElementById('filtersWrap');
  box.innerHTML = cats.map(c => { const count = c === 'همه' ? totalCount : (counts[c] || 0); const label = `${c} (${count.toLocaleString('fa-IR')})`; return `<button class="filter-btn ${c === activeCategory ? 'active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(label)}</button>`; }).join('');
  box.querySelectorAll('button').forEach(btn => btn.onclick = () => { activeCategory = btn.dataset.cat; displayLimit = INITIAL_COUNT; buildFilters(); render(); });
}

function getFilteredList() {
  let list = allNews;
  if (activeMode === 'unread') list = list.filter(n => !readLinks.has(n.link));
  else if (activeMode === 'saved') list = list.filter(n => savedLinks.has(n.link));
  else if (activeMode === 'trending') return getTrendingNews(30, list);
  if (activeCategory !== 'همه') list = list.filter(n => n.category === activeCategory);
  if (searchQuery.trim()) { const q = searchQuery.trim().toLowerCase(); list = list.filter(n => (n.title || '').toLowerCase().includes(q) || (n.plain || '').toLowerCase().includes(q)); }
  return list;
}

function render() {
  const list = getFilteredList(); const box = document.getElementById('content');
  if (!list.length) { 
      let msg = '📭 خبری یافت نشد'; 
      if (activeMode === 'trending') msg = `🔥 هنوز خبری به ${TRENDING_VIEW_THRESHOLD} بازدید نرسیده است.`; 
      box.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-muted);font-size:1.1rem;">${msg}</div>`; updateUI(); return; 
  }
  
  const showing = Math.min(displayLimit, list.length); const display = list.slice(0, showing);
  box.innerHTML = display.map((n, i) => {
    const isRead = readLinks.has(n.link); 
    const isSaved = savedLinks.has(n.link); 
    const isManual = n._manual === true; 
    const vHtml = viewsBadgeHtml(n.link);
    const isFeatured = n.is_featured === true;
    
    const img = n.image ? `<div class="card-img-wrap"><img class="card-img" src="${escapeHtml(n.image)}" loading="lazy" onerror="this.parentElement.style.display='none'"></div>` : '';
    return `
      <article class="card ${isRead ? 'read' : ''} ${isSaved ? 'saved' : ''} ${isManual ? 'manual' : ''} ${isFeatured ? 'featured' : ''}" data-link="${escapeHtml(n.link)}" data-idx="${i}">
        <button class="star-btn ${isSaved ? 'saved' : ''}" data-star="${i}">${isSaved ? '★' : '☆'}</button>
        ${img}
        <div class="card-body">
          <div class="card-top">
            <span class="source-tag ${isFeatured ? 'featured' : (isManual ? 'manual' : '')}">
              ${isFeatured ? '⭐ خبر ویژه' : escapeHtml(n.source)}
            </span>
            ${vHtml}
          </div>
          <h2>${escapeHtml(n.title)}</h2><p>${escapeHtml(n.summary || '')}</p>
          <div class="card-footer"><span>🕐 ${formatTime(n.date)}</span><span style="background:var(--glass-border);padding:4px 10px;border-radius:10px;">📖 ${Math.max(1, Math.ceil((n.textLength||0)/1000))} دقیقه</span></div>
        </div>
      </article>
    `;
  }).join('');
  if (showing < list.length) box.innerHTML += `<div style="grid-column:1/-1;text-align:center;padding:20px;"><div class="btn" onclick="displayLimit+=10;render()">نمایش بیشتر ⏳</div></div>`;
  window.__currentList = display; updateUI();
}

function updateUI() {
  document.getElementById('cntAll').textContent = getFilteredList().length.toLocaleString('fa-IR'); 
  document.getElementById('cntUnread').textContent = allNews.filter(n => !readLinks.has(n.link)).length.toLocaleString('fa-IR');
  document.getElementById('cntSaved').textContent = savedLinks.size.toLocaleString('fa-IR');
  document.getElementById('cntTrending').textContent = allNews.filter(n => isHotNews(n.link)).length.toLocaleString('fa-IR');
  document.getElementById('unreadCount').textContent = allNews.filter(n => !readLinks.has(n.link)).length.toLocaleString('fa-IR');
  document.getElementById('savedBadge').style.display = savedLinks.size > 0 ? 'block' : 'none';
  document.getElementById('savedBadge').textContent = savedLinks.size;
  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === activeMode));
}

function openModal(idx) {
  const news = window.__currentList[idx]; if (!news) return; currentNews = news;
  if (currentUser) { markAsRead(news.link); updateUI(); }
  const hero = document.getElementById('modalHero'); if (news.image) { hero.src = news.image; hero.style.display = 'block'; } else hero.style.display = 'none';
  document.getElementById('modalTitle').textContent = news.title;
  document.getElementById('modalMeta').innerHTML = `<span class="source-tag ${news.is_featured ? 'featured' : (news._manual ? 'manual' : '')}">${news.is_featured ? '⭐ ویژه' : escapeHtml(news.source)}</span><span style="background:var(--glass-border);padding:4px 10px;border-radius:10px;font-size:0.8rem;">🕐 ${formatTime(news.date)}</span>${viewsBadgeHtml(news.link)}`;
  document.getElementById('modalBody').innerHTML = cleanContent(news.content || news.plain || '');
  const srcBtn = document.getElementById('modalSourceBtn'); if (news._manual && (!news.link || news.link.startsWith('manual:'))) srcBtn.style.display = 'none'; else { srcBtn.style.display = 'flex'; srcBtn.href = news.link; }
  document.getElementById('modal').classList.add('open'); document.body.style.overflow = 'hidden';
  document.getElementById('modalStar').textContent = savedLinks.has(news.link) ? '★' : '☆';
  document.getElementById('modalStar').classList.toggle('saved', savedLinks.has(news.link));
  incrementView(news.link);
}

function closeModal() { document.getElementById('modal').classList.remove('open'); document.body.style.overflow = ''; window.speechSynthesis.cancel(); ttsSpeaking = false; ttsPaused = false; ttsQueue = []; ttsCurrentIndex = 0; document.getElementById('ttsPlayBtn').textContent = '🔊 خواندن'; document.getElementById('ttsPauseBtn').style.display = 'none'; document.getElementById('ttsStopBtn').style.display = 'none'; }

document.getElementById('content').addEventListener('click', (e) => { const star = e.target.closest('.star-btn'); if (star) { e.stopPropagation(); const idx = +star.dataset.star; const saved = toggleSaved(window.__currentList[idx].link); if(!currentUser) return; showToast(saved ? '⭐ ذخیره شد' : 'حذف شد'); star.classList.toggle('saved', saved); star.textContent = saved ? '★' : '☆'; updateUI(); return; } const card = e.target.closest('.card'); if (card) openModal(+card.dataset.idx); });
document.querySelectorAll('.nav-btn').forEach(btn => btn.onclick = () => { activeMode = btn.dataset.mode; displayLimit = INITIAL_COUNT; buildFilters(); render(); });
document.getElementById('searchInput').addEventListener('input', (e) => { searchQuery = e.target.value; displayLimit = INITIAL_COUNT; buildFilters(); render(); });
document.getElementById('refreshBtn').onclick = () => { loadAll(); };
document.getElementById('modalClose').onclick = closeModal; document.getElementById('modal').onclick = (e) => { if (e.target.id === 'modal') closeModal(); };
document.getElementById('modalStar').onclick = () => { if (!currentNews) return; const saved = toggleSaved(currentNews.link); if(!currentUser) return; showToast(saved ? '⭐ ذخیره شد' : 'حذف شد'); document.getElementById('modalStar').textContent = saved ? '★' : '☆'; document.getElementById('modalStar').classList.toggle('saved', saved); render(); };
document.getElementById('modalStarBtn').onclick = () => { if (!currentNews) return; const saved = toggleSaved(currentNews.link); if(!currentUser) return; showToast(saved ? '⭐ ذخیره شد' : 'حذف شد'); document.getElementById('modalStar').textContent = saved ? '★' : '☆'; document.getElementById('modalStar').classList.toggle('saved', saved); render(); };

document.getElementById('themeBtn').onclick = () => { const html = document.documentElement; const isLight = html.getAttribute('data-theme') === 'light'; html.setAttribute('data-theme', isLight ? 'dark' : 'light'); document.getElementById('themeBtn').textContent = isLight ? '🌙' : '☀️'; localStorage.setItem('lrep_theme_v10', isLight ? 'dark' : 'light'); };
document.getElementById('settingsBtn').onclick = () => document.getElementById('settingsModal').classList.add('open');
document.getElementById('settingsClose').onclick = () => document.getElementById('settingsModal').classList.remove('open');
document.getElementById('fontPlus').onclick = () => { const cur = parseFloat(getComputedStyle(document.documentElement).fontSize); const next = Math.min(cur + 2, 24); document.documentElement.style.setProperty('--base-font-size', next + 'px'); localStorage.setItem('lrep_font_v10', next); document.getElementById('fontVal').textContent = next.toLocaleString('fa-IR'); };
document.getElementById('fontMinus').onclick = () => { const cur = parseFloat(getComputedStyle(document.documentElement).fontSize); const next = Math.max(cur - 2, 12); document.documentElement.style.setProperty('--base-font-size', next + 'px'); localStorage.setItem('lrep_font_v10', next); document.getElementById('fontVal').textContent = next.toLocaleString('fa-IR'); };

document.getElementById('statsBtn').onclick = () => {
  document.getElementById('statsModal').classList.add('open');
  const totalRead = allNews.filter(n => readLinks.has(n.link)).length; const totalSaved = allNews.filter(n => savedLinks.has(n.link)).length;
  const totalViews = Object.values(newsViews).reduce((a, b) => a + (Number(b) || 0), 0); const hotCount = allNews.filter(n => isHotNews(n.link)).length;
  document.getElementById('statsContent').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:10px;">
      ${currentUser ? `<div style="display:flex;justify-content:space-between;padding:10px;background:rgba(59,130,246,0.2);border-radius:10px;"><span>کاربر:</span><b>${currentUser.email.replace(EMAIL_DOMAIN, '')}</b></div>` : ''}
      <div style="display:flex;justify-content:space-between;padding:10px;background:var(--glass-bg);border-radius:10px;"><span>کل اخبار</span><b>${allNews.length.toLocaleString('fa-IR')}</b></div>
      <div style="display:flex;justify-content:space-between;padding:10px;background:var(--glass-bg);border-radius:10px;"><span>خوانده شده</span><b>${totalRead.toLocaleString('fa-IR')}</b></div>
      <div style="display:flex;justify-content:space-between;padding:10px;background:var(--glass-bg);border-radius:10px;"><span>ذخیره شده</span><b>${totalSaved.toLocaleString('fa-IR')}</b></div>
      <div style="display:flex;justify-content:space-between;padding:10px;background:var(--glass-bg);border-radius:10px;"><span>👁 مجموع بازدید</span><b>${totalViews.toLocaleString('fa-IR')}</b></div>
    </div>
  `;
};
document.getElementById('statsClose').onclick = () => document.getElementById('statsModal').classList.remove('open');

/* ==========================================
   سیستم لاگین و پیام‌ها
   ========================================== */
const authModal = document.getElementById('authModal');
document.getElementById('userBtn').onclick = () => {
  if (!supabaseClient) return showToast('سیستم لاگین در دسترس نیست', true);
  if (currentUser) {
    if (confirm('از حساب خارج می‌شوید؟')) { supabaseClient.auth.signOut().then(() => location.reload()); }
  } else { authModal.classList.add('open'); }
};
document.getElementById('authClose').onclick = () => authModal.classList.remove('open');

document.getElementById('tabLogin').onclick = () => { document.getElementById('loginForm').style.display = 'block'; document.getElementById('registerForm').style.display = 'none'; document.getElementById('tabLogin').classList.add('active'); document.getElementById('tabRegister').classList.remove('active'); };
document.getElementById('tabRegister').onclick = () => { document.getElementById('loginForm').style.display = 'none'; document.getElementById('registerForm').style.display = 'block'; document.getElementById('tabLogin').classList.remove('active'); document.getElementById('tabRegister').classList.add('active'); };

document.getElementById('registerForm').onsubmit = async (e) => {
  e.preventDefault(); if (!supabaseClient) return;
  const btn = document.getElementById('regBtn'); btn.textContent = 'در حال ثبت‌نام...'; btn.disabled = true;
  const email = document.getElementById('regUser').value.trim(); 
  const password = document.getElementById('regPass').value.trim();
  if (password.length < 6) { showToast('رمز عبور باید حداقل ۶ کاراکتر باشد', true); btn.textContent = 'ساخت حساب جدید'; btn.disabled = false; return; }
  
  const { error } = await supabaseClient.auth.signUp({ email: email + EMAIL_DOMAIN, password });
  if (error) { showToast('❌ ' + error.message, true); } else { showToast('✅ ثبت‌نام موفق! خوش آمدید.'); authModal.classList.remove('open'); location.reload(); }
  btn.textContent = 'ساخت حساب جدید'; btn.disabled = false;
};

document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault(); if (!supabaseClient) return;
  const btn = document.getElementById('loginBtn'); btn.textContent = 'در حال ورود...'; btn.disabled = true;
  const email = document.getElementById('loginUser').value.trim(); 
  const password = document.getElementById('loginPass').value.trim();
  const { error } = await supabaseClient.auth.signInWithPassword({ email: email + EMAIL_DOMAIN, password });
  if (error) { showToast('❌ ' + (error.message === 'Invalid login credentials' ? 'نام کاربری یا رمز اشتباه است' : error.message), true); } else { showToast('✅ خوش آمدید!'); authModal.classList.remove('open'); location.reload(); }
  btn.textContent = 'ورود به حساب'; btn.disabled = false;
};

// پیام‌ها
async function checkNotifs() {
    if (!supabaseClient) return;
    let q = supabaseClient.from('notifications').select('*').gt('created_at', lastCheck);
    if (currentUser) { const username = currentUser.email.replace(EMAIL_DOMAIN, ''); q = q.or(`target_user.eq.all,target_user.eq.${username}`); } else { q = q.eq('target_user', 'all'); }

    const { data } = await q;
    if (data && data.length > 0) {
        data.forEach(m => showToast('🔔 پیام: ' + m.message));
        lastCheck = new Date().toISOString();
        const badge = document.getElementById('notifBadge');
        badge.style.display = 'block';
        badge.textContent = parseInt(badge.textContent || 0) + data.length;
    }
}

document.getElementById('notifBtn').onclick = async () => {
    document.getElementById('notifModal').classList.add('open');
    document.getElementById('notifBadge').style.display = 'none';
    document.getElementById('notifBadge').textContent = '0';
    if (!supabaseClient) return;

    let q = supabaseClient.from('notifications').select('*').order('created_at', { ascending: false }).limit(20);
    if (currentUser) { const username = currentUser.email.replace(EMAIL_DOMAIN, ''); q = q.or(`target_user.eq.all,target_user.eq.${username}`); } else { q = q.eq('target_user', 'all'); }

    const { data } = await q;
    const list = document.getElementById('notifList');
    if (data && data.length > 0) {
        list.innerHTML = data.map(m => `<div style="padding:10px; background:rgba(255,255,255,0.05); border-radius:8px; border-right:3px solid var(--accent-blue); font-size:0.9rem;">${m.message}</div>`).join('');
    } else {
        list.innerHTML = '<p style="text-align:center; color:var(--text-muted);">پیامی ندارید.</p>';
    }
};
</script>
